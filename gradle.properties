# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.1.2,26.1.3)
# The NeoForge version must agree with the Minecraft version to get a valid artifact.
neo_version=26.1.2.94
# The NeoForge version range can use any version of NeoForge as bounds.
neo_version_range=[26.1.2,)
# The loader version range can only use the major version of the FancyModLoader as bounds.
# The 26.1.2 test instance ships fancymodloader 11.0.15.
loader_version_range=[11,)


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale.
mod_id=instantunify
# The human-readable display name for the mod.
mod_name=InstantUnify Unofficial Version
# The license of the mod.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.1.8
# The group ID for the mod.
mod_group_id=com.huziyang520.instantunify
# The authors of the mod.
mod_authors=Huziyang520
# The description of the mod. Keep it on a single line: real line breaks break the TOML basic string.
mod_description=Unify duplicate material items from different mods so identical materials stack and craft together. Feedback: https://github.com/Huziyang520/InstantUnify-Unofficial-Version/issues | https://issue.mengcai.online/

## Optional integration

cloth_config_version=26.1.154
